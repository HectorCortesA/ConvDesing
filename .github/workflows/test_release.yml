name: test_release

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run linter
        run: pnpm run lint

      - name: Build project (check only)
        run: pnpm run build:check

  build-linux:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/release' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build Linux
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 10
          command: pnpm run build

      - name: Collect installer files
        run: |
          mkdir -p artifacts
          cp release/0.0.0/*.AppImage artifacts/ 2>/dev/null || true
          cp release/0.0.0/latest-linux.yml artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: artifacts/

  build-windows:
    runs-on: windows-latest
    needs: test
    if: github.ref == 'refs/heads/release' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build Windows
        run: pnpm run build

      - name: Collect installer files
        shell: bash
        run: |
          mkdir -p artifacts
          cp release/0.0.0/*-Setup.exe artifacts/ 2>/dev/null || true
          cp release/0.0.0/*-Setup.exe.blockmap artifacts/ 2>/dev/null || true
          cp release/0.0.0/latest.yml artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: artifacts/

  build-macos:
    runs-on: macos-latest
    needs: test
    if: github.ref == 'refs/heads/release' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build macOS
        run: pnpm run build

      - name: Collect installer files
        run: |
          mkdir -p artifacts
          cp release/0.0.0/*-Installer.dmg artifacts/ 2>/dev/null || true
          cp release/0.0.0/*-Installer.dmg.blockmap artifacts/ 2>/dev/null || true
          cp release/0.0.0/latest-mac.yml artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: artifacts/

  create-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    if: always() && github.ref == 'refs/heads/release' && github.event_name == 'push' && !contains(needs.*.result, 'cancelled') && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux artifacts
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: linux-installer
          path: installers/

      - name: Download Windows artifacts
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: installers/

      - name: Download macOS artifacts
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: installers/

      - name: List installer files
        run: find installers/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: installers/*
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            Automated release build from ConvDesing

            **Installers:**
            - **Linux**: ${{ needs.build-linux.result == 'success' && '✅ AppImage' || '❌ Failed' }}
            - **Windows**: ${{ needs.build-windows.result == 'success' && '✅ NSIS Installer (exe)' || '❌ Failed' }}
            - **macOS**: ${{ needs.build-macos.result == 'success' && '✅ DMG Installer' || '❌ Failed' }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
